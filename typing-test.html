<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test - Hard Mode</title>

    <link href="assets/fonts/google-fonts.css" rel="stylesheet">
    <link href="assets/icons/material-icons.css" rel="stylesheet">
    <link href="assets/icons/fontawesome.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: rgba(20, 25, 40, 0.7);
            --primary: #00f3ff;
            /* Neon Cyan */
            --secondary: #bc13fe;
            /* Neon Purple */
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(0, 0, 0, 0.4);
            --correct: #00ff9d;
            --incorrect: #ff0055;
            --current: rgba(0, 243, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        /* Animated Grid Background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 800px;
        }

        /* Header Bar */
        .test-header {
            padding: 1.5rem 2rem;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }

        .user-name {
            font-weight: 600;
            color: #fff;
        }

        .user-details {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .test-stats {
            display: flex;
            gap: 2rem;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-value.timer {
            color: var(--secondary);
        }

        /* Typing Area */
        .typing-area {
            flex: 1;
            padding: 3rem;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .text-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            line-height: 2;
            color: var(--text-muted);
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
            white-space: pre-wrap;
            word-break: break-all;
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
        }

        /* Blur top and bottom to focus on current line */
        .text-display::before,
        .text-display::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 2;
            pointer-events: none;
        }

        .text-display::before {
            top: 0;
            background: linear-gradient(to bottom, var(--card-bg), transparent);
        }

        .text-display::after {
            bottom: 0;
            background: linear-gradient(to top, var(--card-bg), transparent);
        }


        .word {
            margin-right: 0.5em;
            display: inline-block;
        }

        .char {
            position: relative;
            transition: color 0.1s;
        }

        .char.correct {
            color: var(--text-main);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .char.incorrect {
            color: var(--incorrect);
            text-decoration: underline;
        }

        .char.active {
            color: var(--primary);
            background: var(--current);
            border-radius: 2px;
        }

        .char.active::after {
            content: '|';
            position: absolute;
            right: -2px;
            color: var(--primary);
            animation: blink 1s infinite;
            opacity: 0.8;
            top: -2px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Hide Input */
        .input-hidden {
            position: absolute;
            opacity: 0;
            z-index: -10;
        }

        /* Focus Overlay */
        .focus-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .focus-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .focus-text {
            font-size: 1.5rem;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            animation: pulse 2s infinite;
        }

        /* Result Modal */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .result-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .result-card {
            background: #141928;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
            transform: translateY(20px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-modal.show .result-card {
            transform: translateY(0);
        }

        .result-title {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .result-subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .result-item h4 {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 0.5rem;
        }

        .result-item .val {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .btn-restart {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .difficulty-badge {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid rgba(255, 0, 85, 0.4);
            color: #ff0055;
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <header class="test-header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="displayUsername">Commander</div>
                    <div class="user-details"><span id="displayBranch">UNK</span> • <span id="displayYear">Lvl ?</span>
                    </div>
                </div>
            </div>

            <div class="test-stats">
                <div class="stat-box">
                    <div class="stat-label">Time</div>
                    <div class="stat-value timer" id="timer">05:00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">WPM</div>
                    <div class="stat-value" id="wpm">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Acc</div>
                    <div class="stat-value" id="accuracy">100%</div>
                </div>
            </div>
        </header>

        <!-- Typing Area -->
        <div class="typing-area" onclick="document.getElementById('inputField').focus()">
            <div class="text-display" id="textDisplay"></div>
            <input type="text" id="inputField" class="input-hidden" autocomplete="off">

            <div class="focus-overlay" id="focusOverlay">
                <div class="focus-text">CLICK TO INITIALIZE TYPE LINK</div>
            </div>

            <div class="difficulty-badge">Protocol: DIFFICULT</div>
        </div>
    </div>

    <!-- Results Modal -->
    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <h2 class="result-title">Session Complete</h2>
            <p class="result-subtitle">Data upload successful. Performance metrics analysis:</p>

            <div class="result-grid">
                <div class="result-item">
                    <h4>WPM</h4>
                    <div class="val" id="finalWpm">0</div>
                </div>
                <div class="result-item">
                    <h4>Accuracy</h4>
                    <div class="val" id="finalAcc">0%</div>
                </div>
                <div class="result-item">
                    <h4>Raw Characters</h4>
                    <div class="val" id="finalChars">0</div>
                </div>
                <div class="result-item">
                    <h4>Time Elapsed</h4>
                    <div class="val">5:00</div>
                </div>
            </div>

            <button class="btn-restart" onclick="window.location.href='./typing-test-login.html'">Re-Initialize</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const TIME_LIMIT = 300; // 5 minutes in seconds

        // Complex paragraphs for "Difficult" mode
        const PARAGRAPHS = [
            "The asynchronous nature of JavaScript allows for non-blocking I/O operations, which is essential for high-performance web applications. However, handling callbacks can lead to 'callback hell', a situation where callbacks are nested within other callbacks several levels deep. Promises and async/await syntax were introduced to mitigate this issue, providing a cleaner, more readable way to handle asynchronous code logic.",
            "In object-oriented programming, polymorphism allows objects to be treated as instances of their parent class rather than their actual class. The most common use of polymorphism in OOP occurs when a parent class reference is used to refer to a child class object. This concept is fundamental to building flexible and scalable software architectures, enabling developers to write code that is easier to extend and maintain.",
            "Cryptographic hash functions are mathematical algorithms that map data of arbitrary size to a bit string of a fixed size. It is a one-way function, that is, a function which is practically infeasible to invert. The only way to recreate the input data from an ideal cryptographic hash function's output is to attempt a brute-force search of possible inputs to see if they produce a match.",
            "Quantum computing harnesses the phenomena of quantum mechanics to deliver a huge leap forward in computation to solve certain problems. Quantum computers operate on qubits, which can exist in a state of superposition, representing both 0 and 1 simultaneously. This differs fundamentally from classical bits that can only be either 0 or 1 at any given time.",
            "Normalization is the process of organizing data in a database. This includes creating tables and establishing relationships between those tables according to rules designed both to protect the data and to make the database more flexible by eliminating redundancy and inconsistent dependency. First Normal Form (1NF) sets the very basic rules for an organized database.",
            "Recursive functions are functions that call themselves. They are useful for solving problems that can be defined in terms of smaller, similar subproblems. However, care must be taken to ensure that the recursion terminates; otherwise, it will lead to a stack overflow error, crashing the program. The base case is the condition under which the recursion stops.",
            "The Document Object Model (DOM) is a cross-platform and language-independent interface that treats an XML or HTML document as a tree structure wherein each node is an object representing a part of the document. The DOM represents a document with a logical tree. Each branch of the tree ends in a node, and each node contains objects. DOM methods allow programmatic access to the tree."
        ];

        // --- STATE ---
        let timeLeft = TIME_LIMIT;
        let timer = null;
        let isRunning = false;
        let charIndex = 0;
        let mistakes = 0;
        let isFocused = false;
        let currentText = "";

        // --- ELEMENTS ---
        const textDisplay = document.getElementById('textDisplay');
        const inputField = document.getElementById('inputField');
        const timerElement = document.getElementById('timer');
        const wpmElement = document.getElementById('wpm');
        const accElement = document.getElementById('accuracy');
        const focusOverlay = document.getElementById('focusOverlay');
        const resultModal = document.getElementById('resultModal');

        // --- URL PARAMS ---
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('name') || 'Guest';
        const branch = urlParams.get('branch') || 'UNK';
        const year = urlParams.get('year') || '?';

        document.getElementById('displayUsername').innerText = username;
        document.getElementById('userAvatar').innerText = username.charAt(0).toUpperCase();
        document.getElementById('displayBranch').innerText = branch.toUpperCase();
        document.getElementById('displayYear').innerText = `Lvl ${year}`;

        // --- INITIALIZATION ---
        function initGame() {
            // Generate long text by joining random paragraphs
            let text = "";
            for (let i = 0; i < 10; i++) { // Generate enough text for 5 mins
                text += PARAGRAPHS[Math.floor(Math.random() * PARAGRAPHS.length)] + " ";
            }
            currentText = text.trim();

            // Render text
            textDisplay.innerHTML = '';
            currentText.split('').forEach(char => {
                let span = document.createElement('span');
                span.innerText = char;
                textDisplay.appendChild(span);
            });

            // Set initial active char
            textDisplay.querySelectorAll('span')[0].classList.add('active');

            // Event Listeners
            inputField.addEventListener('input', initTyping);
            inputField.addEventListener('blur', () => {
                focusOverlay.classList.remove('hidden');
                isFocused = false;
            });

            focusOverlay.addEventListener('click', () => {
                inputField.focus();
                focusOverlay.classList.add('hidden');
                isFocused = true;
            });

            // Focus initially
            // document.addEventListener('keydown', () => inputField.focus());
        }

        function initTyping() {
            const chars = textDisplay.querySelectorAll('span');
            let typedChar = inputField.value.split('')[charIndex];

            if (!isRunning && inputField.value.length > 0) {
                // Start Timer
                isRunning = true;
                timer = setInterval(updateTimer, 1000);
            }

            // Handle backspace or data entry
            if (inputField.value.length < charIndex) {
                // Must have backspaced
                // Not strictly supporting backspace in this simple "stream" implementation 
                // usually, but let's handle it for basic usability
                if (charIndex > 0) {
                    chars[charIndex].classList.remove('active');
                    charIndex--;
                    chars[charIndex].classList.remove('correct', 'incorrect');
                    chars[charIndex].classList.add('active');
                }
                // Reset input content to match valid charIndex to prevent desync
                // Ideally we don't clear value, but for simple matching:
                return;
            }

            // If we are here, we typed a character
            if (typedChar == null) return; // Ghost input check

            if (chars[charIndex].innerText === typedChar) {
                chars[charIndex].classList.add('correct');
            } else {
                mistakes++;
                chars[charIndex].classList.add('incorrect');
            }

            chars[charIndex].classList.remove('active');
            charIndex++;

            if (charIndex < chars.length) {
                chars[charIndex].classList.add('active');

                // Auto-scroll logic if needed (simple version)
                if (chars[charIndex].offsetTop > textDisplay.clientHeight - 60) {
                    // textDisplay.scrollTop += 30; // Manual scroll or just let overflow hide
                    // Improved scroll:
                    chars[charIndex].scrollIntoView({ block: "center", behavior: "smooth" });
                }
            } else {
                // End of text (unlikely in 5 mins with correct generation, but possible)
                clearInterval(timer);
                finishTest();
            }

            // Calculate stats
            let wpm = Math.round(((charIndex - mistakes) / 5) / ((TIME_LIMIT - timeLeft) / 60));
            wpm = wpm < 0 || !wpm || wpm === Infinity ? 0 : wpm;

            let accuracy = Math.round(((charIndex - mistakes) / charIndex) * 100);
            accuracy = accuracy < 0 || !accuracy ? 100 : accuracy;

            wpmElement.innerText = wpm;
            accElement.innerText = accuracy + "%";
        }

        function updateTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                timerElement.innerText = `${min}:${sec < 10 ? '0' + sec : sec}`;
            } else {
                clearInterval(timer);
                finishTest();
            }
        }

        function finishTest() {
            inputField.disabled = true;
            isRunning = false;

            // Final Calcs
            let wpm = wpmElement.innerText;
            let acc = accElement.innerText;

            document.getElementById('finalWpm').innerText = wpm;
            document.getElementById('finalAcc').innerText = acc;
            document.getElementById('finalChars').innerText = charIndex;

            resultModal.classList.add('show');
        }

        initGame();

    </script>
</body>

</html>
